document.getElementById('year').textContent=new Date().getFullYear();
if('IntersectionObserver'in window){window.__revealObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('visible');window.__revealObserver.unobserve(entry.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(el=>window.__revealObserver.observe(el))}else document.querySelectorAll('.reveal').forEach(el=>el.classList.add('visible'));
const topBtn=document.getElementById('backToTop');window.addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>550),{passive:true});topBtn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
render();
</script></body></html>
