function applyText(){document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;el.textContent=t(k)});document.querySelectorAll('[data-k-html]').forEach(el=>el.innerHTML=t(el.dataset.kHtml));document.querySelectorAll('[data-k-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.kAria)));document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.getElementById('lang').textContent=lang.toUpperCase();renderCards();renderSteps();renderGallery();renderInterest();}
const cards=[{img:'home',type:'houses',stage:'readyStatus',meter:82},{img:'apartment',type:'apartments',stage:'readyStatus',meter:64},{img:'community',type:'houses',stage:'comingStatus',meter:30}];
function renderCards(){const grid=document.getElementById('releasesGrid'),filter=document.querySelector('.filter.active')?.dataset.filter||'all';grid.innerHTML=cards.map((c,i)=>({c,i})).filter(x=>filter==='all'||x.c.type===filter).map(({c,i})=>`<article class="release-card reveal visible"><div class="photo"><img src="${ASSETS[c.img]}" alt="${t('releaseTypes')[i]} — ${t('releasePlaces')[i]}" loading="lazy"><span class="status">${t(c.stage)}</span><button class="preview-btn" data-preview="${c.img}" data-title="${t('releaseNames')[i]}" data-text="${t('releaseStages')[i]} · ${t('units')[i]}" aria-label="${t('preview')}: ${t('releaseNames')[i]}">⌕</button></div><div class="release-content"><span class="eyebrow">${t('releaseTypes')[i]}</span><h3>${t('releaseNames')[i]}</h3><div class="location">${t('releasePlaces')[i]}</div><div class="meta"><span>${t('units')[i]}</span><span>${t('availability')}</span></div><div class="kicker">${t('stage')} · ${t(c.stage)}</div><div class="meter"><i style="width:${c.meter}%"></i></div><a href="#contact" class="card-link"><span>${t('open')}</span><b>↗</b></a></div></article>`).join('');document.querySelectorAll('.preview-btn').forEach(b=>b.addEventListener('click',()=>openPreview(b.dataset.preview,b.dataset.title,b.dataset.text)));}
function renderSteps(){const arr=[['01','step1Title','step1Body'],['02','step2Title','step2Body'],['03','step3Title','step3Body'],['04','step4Title','step4Body']];document.getElementById('steps').innerHTML=arr.map(a=>`<div class="step reveal"><span class="step-num">${a[0]}</span><div><h3>${t(a[1])}</h3><p>${t(a[2])}</p></div></div>`).join('')}
function renderGallery(){const arr=[['handover','photo1','photoText1'],['welcome','photo2','photoText2'],['key','photo3','photoText3']];document.getElementById('gallery').innerHTML=arr.map(a=>`<div class="gallery-item" tabindex="0" role="button" data-preview="${a[0]}" data-title="${t(a[1])}" data-text="${t(a[2])}"><img src="${ASSETS[a[0]]}" alt="${t(a[1])}" loading="lazy"><div class="gallery-caption"><small>FIRST KEYS / 0${arr.indexOf(a)+1}</small><h3>${t(a[1])}</h3><span>${t(a[2])}</span></div></div>`).join('');document.querySelectorAll('.gallery-item').forEach(b=>{b.addEventListener('click',()=>openPreview(b.dataset.preview,b.dataset.title,b.dataset.text));b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.click()}})})}
function renderInterest(){const s=document.getElementById('interest');s.innerHTML=`<option value="" selected disabled>${t('formSelect')}</option>`+t('releaseNames').map(x=>`<option>${x}</option>`).join('')}
document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));renderCards()}));
let modal=document.getElementById('modal');function openPreview(key,title,copy){document.getElementById('modalImg').src=ASSETS[key];document.getElementById('modalImg').alt=title;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=copy;modal.classList.add('open');document.body.style.overflow='hidden';document.getElementById('close').focus()}function closePreview(){modal.classList.remove('open');document.body.style.overflow='';document.getElementById('modalImg').src=''}
document.getElementById('close').addEventListener('click',closePreview);modal.addEventListener('click',e=>{if(e.target===modal)closePreview()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});
document.getElementById('theme').addEventListener('click',()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;safeSet('firstkeys-theme',next)});const savedTheme=safeGet('firstkeys-theme');document.documentElement.dataset.theme=savedTheme||((matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
document.getElementById('lang').addEventListener('click',()=>{lang=supported[(supported.indexOf(lang)+1)%supported.length];safeSet('firstkeys-language',lang);applyText()});const savedLang=safeGet('firstkeys-language'),browser=(navigator.language||'en').toLowerCase().slice(0,2);lang=I18N[savedLang]?savedLang:(I18N[browser]?browser:'en');applyText();
document.getElementById('menu').addEventListener('click',()=>document.getElementById('navlinks').classList.toggle('open'));document.querySelectorAll('.navlinks a').forEach(a=>a.addEventListener('click',()=>document.getElementById('navlinks').classList.remove('open')));
const header=document.getElementById('header'),toTopButton=document.getElementById('toTop');function scrollUI(){header.classList.toggle('scrolled',scrollY>25);toTopButton.classList.toggle('show',scrollY>550)}addEventListener('scroll',scrollUI,{passive:true});scrollUI();toTopButton.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));
if('IntersectionObserver'in window){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.reveal').forEach(x=>io.observe(x))}else document.querySelectorAll('.reveal').forEach(x=>x.classList.add('visible'));
const toast=document.getElementById('toast');document.getElementById('contactForm').addEventListener('submit',e=>{e.preventDefault();toast.textContent=t('formSuccess');toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3600);e.currentTarget.reset();renderInterest()});
</script></body></html>
